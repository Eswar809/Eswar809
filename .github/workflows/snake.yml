name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *" # regenerates daily at midnight UTC
  workflow_dispatch: # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Eswar809
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00b8d9
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00D9F5&color_dots=#101B33,#0e3a52,#00707f,#00a7bd,#00F5A0

      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
